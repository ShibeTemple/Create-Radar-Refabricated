plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = "${mod_version}+mc${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }

    // Create Fabric and related
    maven { url 'https://mvn.devos.one/snapshots/' }
    maven { url 'https://mvn.devos.one/releases/' }
    maven { url 'https://maven.createmod.net' }
    maven { url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven { url 'https://maven.jamieswhiteshirt.com/libs-release' }

    // Create Big Cannons
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = "https://maven.realrobotix.me/master/"
        content { includeGroup "com.rbasamoyai" }
    }

    // REI (Roughly Enough Items)
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.architectury.dev/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fabric - pulls in everything transitively
    modImplementation "com.simibubi.create:create-fabric:${create_version}"

    // Create Big Cannons (optional compat, compile-only)
    modCompileOnly fileTree(dir: 'libs', include: '*.jar')

    // REI - runtime only for testing
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

    // Spark profiler (dev runtime only)
    modRuntimeOnly "maven.modrinth:spark:${spark_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
